# Local development database only (npm run db:up). Never used on a server.
# Production and staging: docker-compose.prod.yml (+ deploy/rehearsal/docker-compose.rehearsal.yml for the local
# rehearsal), with the variable names in deploy/env.prod.example.
services:
  postgres:
    image: postgres:18-alpine
    container_name: hagalery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hagalery}
      POSTGRES_USER: ${POSTGRES_USER:-hagalery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hagalery_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
