name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hagalery
          POSTGRES_USER: hagalery
          POSTGRES_PASSWORD: hagalery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hagalery -d hagalery"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hagalery:hagalery_ci@localhost:5432/hagalery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # build first: it builds the shared libs and generates the Prisma client that type-aware lint reads
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
