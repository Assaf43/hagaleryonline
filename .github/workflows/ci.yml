name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hagalery
          POSTGRES_USER: hagalery
          POSTGRES_PASSWORD: hagalery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hagalery -d hagalery"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hagalery:hagalery_ci@localhost:5432/hagalery
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # production dependencies: fails on a high / critical advisory not in audit-allowlist.json (OWASP A06)
      - run: node scripts/audit-check.mjs
      - run: npm run format:check
      # build first: it builds the shared libs and generates the Prisma client that type-aware lint reads
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # S3 storage test double: a frozen legacy build of real MinIO (the official images are gone). Test double only,
      # never used in production. The e2e creates and removes its own buckets.
      - run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin-ci-test-only \
            --entrypoint minio bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20 server /tmp/data
          for i in $(seq 1 30); do curl -fs http://localhost:9000/minio/health/live && break; sleep 1; done
          curl -fsS http://localhost:9000/minio/health/live
      # e2e creates, migrates and seeds its own <db>_test database (apps/api/test/e2e-global-setup.ts)
      - run: npm run test:e2e
        env:
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_ACCESS_KEY_ID: minioadmin
          S3_TEST_SECRET_ACCESS_KEY: minioadmin-ci-test-only

  # Spec 9b.1: the three image targets build (no push; publishing is 9c) and start far enough to prove they work.
  docker:
    permissions:
      contents: read
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build app, caddy and backup
        run: |
          for target in app caddy backup; do
            docker build --target "$target" --build-arg APP_VERSION=${{ github.sha }} -t "nesto-$target:ci" .
          done
      # Every CADDY_ENV x CADDY_TLS combination. origin: a throwaway self-signed pair stands in for the Cloudflare
      # Origin CA certificate (only so --validate can load it); staging: a dummy user and the hash of a random
      # password made here and thrown away, so no hash is ever committed.
      - name: Caddyfile adapts (production|staging|rehearsal x origin|auto)
        run: |
          origin="$(mktemp -d)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj /CN=origin.example.test \
            -keyout "$origin/key.pem" -out "$origin/cert.pem" 2> /dev/null
          gate_hash="$(docker run --rm nesto-caddy:ci caddy hash-password --plaintext "$(openssl rand -hex 24)")"
          ranges="$(grep -v '^#' deploy/cloudflare-ips.txt | tr '\n' ' ')"
          for env in production staging rehearsal; do
            for tls in origin auto; do
              echo "caddy adapt: CADDY_ENV=$env CADDY_TLS=$tls"
              docker run --rm -v "$origin:/etc/caddy/origin:ro" \
                -e SITE_HOST=shop.example.test -e ADMIN_HOST=admin.example.test \
                -e S3_PUBLIC_BUCKET=nesto-media-public -e S3_PUBLIC_UPSTREAM=http://minio:9000 \
                -e CADDY_GLOBAL_OPTIONS=local_certs -e CADDY_ENV="$env" -e CADDY_TLS="$tls" \
                -e CF_TRUSTED_RANGES="$ranges" -e STAGING_AUTH_USER=ci-dummy \
                -e STAGING_AUTH_HASH="$gate_hash" \
                nesto-caddy:ci caddy adapt --validate --config /etc/caddy/Caddyfile > /dev/null
            done
          done
          rm -rf "$origin"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Real Caddy (the image built above) behind a fake Cloudflare on a throwaway network: client IP, staging gate,
      # HSTS, body limits (scripts/caddy-proxy.spec.mjs).
      - name: Caddy proxy spec
        run: npx vitest run scripts/caddy-proxy.spec.mjs
        env:
          CADDY_TEST_IMAGE: nesto-caddy:ci
      - name: Runtime checks (non-root, Prisma client, tsx, backup tools)
        run: |
          test "$(docker run --rm nesto-app:ci id -u)" != 0
          # The API uses the prisma-client generator (apps/api/src/generated/prisma), not the @prisma/client entry.
          docker run --rm nesto-app:ci node -e "import('./apps/api/dist/generated/prisma/client.js').then((m) => { if (typeof m.PrismaClient !== 'function') process.exit(1); })"
          docker run --rm nesto-app:ci npx tsx --version
          docker run --rm nesto-backup:ci sh -c 'test "$(id -u)" != 0 && pg_dump --version | grep -q " 18\." && age --version'
