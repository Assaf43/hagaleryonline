# Local rehearsal overlay (spec 9b.7): the production services plus MinIO as the S3 store, on this machine only.
#
#   IMAGE_TAG=<tag> docker compose -p nesto-rehearsal -f docker-compose.prod.yml \
#     -f deploy/rehearsal/docker-compose.rehearsal.yml --env-file deploy/rehearsal/.env.rehearsal up -d
#
# The env file is generated (and git-ignored) by: node deploy/rehearsal/make-env.mjs --age-recipient age1...
# It sets CADDY_GLOBAL_OPTIONS=local_certs, S3_PUBLIC_UPSTREAM=http://minio:9000 and S3_ENDPOINT=http://minio:9000.
#
# MinIO here is a FROZEN TEST DOUBLE, LOCAL ONLY: the official MinIO images are no longer published, so these are the
# last Bitnami legacy builds, pinned by tag and digest. They never go into docker-compose.prod.yml or onto a server.
# Host ports: only the MinIO console, on 127.0.0.1:9001. S3 itself (9000) stays on the compose networks.

volumes:
  minio_data: {}

services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    security_opt: ['no-new-privileges:true']
    # The plain server, not the Bitnami setup scripts. It runs as uid 1001; /bitnami/minio/data belongs to that user in
    # the image, so a new named volume mounted there gets the same owner.
    entrypoint: ['minio']
    command: ['server', '/bitnami/minio/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      - '127.0.0.1:9001:9001'
    # internal: the API and backup. edge: Caddy proxies /media to it, as it reaches the real S3 endpoint in production.
    networks: [internal, edge]
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot: buckets, anonymous read on the public bucket, the backup lifecycle, the three users and their policies.
  # Idempotent, so every `up` may run it again.
  minio-setup:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3@sha256:73bd39f7899a0cef12b8dd5df13aa93a3ed1aaa44236542442e9ac76819ac158
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    security_opt: ['no-new-privileges:true']
    entrypoint: ['sh']
    command: ['/setup/minio-setup.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:?S3_PUBLIC_BUCKET is required}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:?S3_PRIVATE_BUCKET is required}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required}
      APP_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      APP_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      BACKUP_WRITER_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY_ID:?BACKUP_S3_ACCESS_KEY_ID is required}
      BACKUP_WRITER_SECRET_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?BACKUP_S3_SECRET_ACCESS_KEY is required}
      BACKUP_READER_ACCESS_KEY: ${BACKUP_READ_ACCESS_KEY_ID:?BACKUP_READ_ACCESS_KEY_ID is required}
      BACKUP_READER_SECRET_KEY: ${BACKUP_READ_SECRET_ACCESS_KEY:?BACKUP_READ_SECRET_ACCESS_KEY is required}
    volumes:
      - ./deploy/rehearsal/minio-setup.sh:/setup/minio-setup.sh:ro
    networks: [internal]
    depends_on:
      minio:
        condition: service_healthy

  api:
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  backup:
    depends_on:
      minio-setup:
        condition: service_completed_successfully
