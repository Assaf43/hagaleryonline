<section class="container page narrow">
  <h1>מצב ההזמנה שלי</h1>
  <p class="intro">הזינו את מספר ההזמנה ואת מספר הטלפון שאיתו הזמנתם.</p>

  <form class="stack" novalidate (submit)="submit($event)">
    <div class="field">
      <label class="field-label" [for]="ids.number">מספר הזמנה</label>
      <input
        class="input"
        type="text"
        dir="ltr"
        inputmode="numeric"
        autocomplete="off"
        maxlength="20"
        [id]="ids.number"
        [value]="number()"
        [attr.aria-invalid]="errors().number ? true : null"
        [attr.aria-describedby]="errors().number ? ids.number + '-error' : null"
        (input)="input('number', $event)"
      />
      @if (errors().number; as e) {
        <p class="field-error" [id]="ids.number + '-error'">{{ e }}</p>
      }
    </div>
    <div class="field">
      <label class="field-label" [for]="ids.phone">טלפון נייד</label>
      <input
        class="input"
        type="tel"
        dir="ltr"
        inputmode="tel"
        autocomplete="tel"
        maxlength="20"
        [id]="ids.phone"
        [value]="phone()"
        [attr.aria-invalid]="errors().phone ? true : null"
        [attr.aria-describedby]="errors().phone ? ids.phone + '-error' : null"
        (input)="input('phone', $event)"
      />
      @if (errors().phone; as e) {
        <p class="field-error" [id]="ids.phone + '-error'">{{ e }}</p>
      }
    </div>

    <p class="form-error" role="alert">{{ formError() }}</p>

    <div>
      <button type="submit" class="btn btn-primary" [disabled]="busy()">הצגת ההזמנה</button>
    </div>
  </form>
</section>
