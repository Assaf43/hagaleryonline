<div class="container">
  @if (failed()) {
    <section class="section">
      <h1>לא הצלחנו לטעון את הדף</h1>
      <p role="alert">לא הצלחנו לטעון את הדף. נסו שוב.</p>
      <button type="button" class="btn btn-secondary" (click)="reload()">נסו שוב</button>
    </section>
  }
  @for (s of visibleSections(); track s.id) {
    @switch (s.kind) {
      @case ('hero') {
        <hg-home-hero [banner]="s.banner" [fallback]="s.fallback" />
      }
      @case ('trust') {
        <hg-home-trust />
      }
      @case ('rooms') {
        <hg-home-rooms [rooms]="s.rooms" />
      }
      @case ('categories') {
        <hg-home-categories [categories]="s.categories" [titleHe]="s.titleHe" [headingId]="'sec-' + s.id" />
      }
      @case ('products') {
        <hg-home-products [items]="s.items" [titleHe]="s.titleHe" [link]="s.link" [headingId]="'sec-' + s.id" />
      }
      @case ('banner_pair') {
        <hg-home-banner-pair [banners]="s.banners" [titleHe]="s.titleHe" [headingId]="'sec-' + s.id" />
      }
    }
  }
</div>
