<h1>החנות</h1>
<p class="page-intro">פרטי החנות הפיזית. הם מוצגים לצוות בלבד ולא מופיעים באתר.</p>

@if (error() && !loaded()) {
  <div class="form-error" role="alert">
    <p>{{ error() }}</p>
    <button matButton="outlined" type="button" (click)="reload()">נסו שוב</button>
  </div>
}

@if (loaded()) {
  <form class="settings" (submit)="save($event)">
    <label>
      <span>שם החנות</span>
      <input
        name="nameHe"
        type="text"
        [attr.maxlength]="nameMax"
        required
        [ngModel]="nameHe()"
        (ngModelChange)="nameHe.set($event)"
      />
    </label>
    <label>
      <span>כתובת</span>
      <input
        name="address"
        type="text"
        [attr.maxlength]="textMax"
        [ngModel]="address()"
        (ngModelChange)="address.set($event)"
      />
    </label>
    <label>
      <span>שעות פעילות</span>
      <input
        name="hoursHe"
        type="text"
        [attr.maxlength]="textMax"
        [ngModel]="hoursHe()"
        (ngModelChange)="hoursHe.set($event)"
      />
    </label>
    <label>
      <span>טלפון</span>
      <input
        name="phone"
        type="tel"
        dir="ltr"
        [attr.maxlength]="textMax"
        [ngModel]="phone()"
        (ngModelChange)="phone.set($event)"
      />
    </label>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <button matButton="filled" type="submit" [disabled]="busy()">שמירה</button>
  </form>
}
