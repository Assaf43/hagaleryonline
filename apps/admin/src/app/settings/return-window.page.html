<h1>ימי החזרה</h1>
<p class="page-intro">כמה ימים אחרי האספקה לקוח יכול לבקש החזרה או החלפה באתר. דיווח על מוצר פגום אפשרי בכל זמן.</p>

@if (error() && !loaded()) {
  <div class="form-error" role="alert">
    <p>{{ error() }}</p>
    <button matButton="outlined" type="button" (click)="reload()">נסו שוב</button>
  </div>
}

@if (loaded()) {
  <form class="settings" (submit)="save($event)">
    <label>
      <span>מספר ימים ({{ limits.min }}–{{ limits.max }})</span>
      <input
        name="returnWindowDays"
        type="number"
        inputmode="numeric"
        step="1"
        [min]="limits.min"
        [max]="limits.max"
        dir="ltr"
        required
        [ngModel]="days()"
        (ngModelChange)="days.set($event)"
      />
    </label>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <button matButton="filled" type="submit" [disabled]="busy()">שמירה</button>
  </form>
}
